version: 1.0
component: deployment
runAs: opc
shell: bash

env:
  variables:
    APP_NAME: "spring-petclinic"
    CONTAINER_PORT: "8080"
    HOST_PORT: "80"

steps:
  - stepType: Command
    name: "Docker login to OCIR"
    command: |
      echo "Logging into OCIR as ${DOCKER_REGISTRY_USER}"
      echo "${DOCKER_REGISTRY_PASSWORD}" | sudo docker login -u ${DOCKER_REGISTRY_USER} --password-stdin ${DOCKER_REGISTRY_URL}
    timeoutInSeconds: 120

  - stepType: Command
    name: "Pull latest image"
    command: |
      sudo docker pull ${DOCKER_IMAGE}
    timeoutInSeconds: 600

  - stepType: Command
    name: "Stop and remove old container"
    command: |
      sudo docker stop ${APP_NAME} || true
      sudo docker rm ${APP_NAME} || true
    timeoutInSeconds: 60

  - stepType: Command
    name: "Run new container"
    command: |
      sudo docker run -d --name ${APP_NAME} \
        --restart unless-stopped \
        -p ${HOST_PORT}:${CONTAINER_PORT} \
        ${DOCKER_IMAGE}
    timeoutInSeconds: 120

  - stepType: Command
    name: "Health check"
    command: |
      sleep 10
      curl -f http://localhost:${HOST_PORT}/actuator/health || (sudo docker logs ${APP_NAME} && exit 1)
    timeoutInSeconds: 120

