version: 0.1
component: build
timeoutInSeconds: 1800
shell: bash

env:
  variables:
    OCI_REGION: "<REGION>"
    OCIR_NAMESPACE: "<TENANCY_NAMESPACE>"
    IMAGE_NAME: "spring-petclinic"
  exportedVariables:
    - IMAGE_TAG

steps:
  - type: Command
    name: "Set image tag"
    command: |
      echo "IMAGE_TAG=${OCI_BUILD_RUN_ID:0:8}" >> $OCI_WORKSPACE_DIR/build_vars.env
      echo "Building spring-petclinic:${OCI_BUILD_RUN_ID:0:8}"

  - type: Command
    name: "Build jar with Maven"
    command: |
      chmod +x mvnw
      ./mvnw -B -q clean package -DskipTests

  - type: Command
    name: "Docker build"
    command: |
      source $OCI_WORKSPACE_DIR/build_vars.env
      docker build -t ${OCI_REGION}.ocir.io/${OCIR_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG} \
                    -t ${OCI_REGION}.ocir.io/${OCIR_NAMESPACE}/${IMAGE_NAME}:latest .

outputArtifacts:
  - name: petclinic-image
    type: DOCKER_IMAGE
    location: ${OCI_REGION}.ocir.io/${OCIR_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}

